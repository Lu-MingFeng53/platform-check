<script>
(function(){
  var done=false;
  function report(){
    if(done) return; done=true;
    var r={
      page: document.documentElement.getAttribute('data-page'),
      platform: navigator.platform,
      heavyRan: !!window.heavyRan,
      fakeIcon: !!document.getElementById('fv-loading-icon'),
      pagespeedDiv: !!document.querySelector('[data-optimizer]'),
      killedScripts: document.querySelectorAll('script[type="text/lazyload"]').length
    };
    var el=document.getElementById('status');
    if(el){
      el.innerHTML='系统：'+r.platform+'<br>网店程序运行了吗：'+(r.heavyRan?'运行了':'没运行')+
        '<br>隐形假大字：'+(r.fakeIcon||r.pagespeedDiv?'有':'没有')+
        '<br>被停掉的程序：'+r.killedScripts+' 个';
    }
    console.error('REPLAY_CHECK '+JSON.stringify(r));
  }
  window.addEventListener('load',function(){setTimeout(report,500)});
  setTimeout(report,15000);
})();
</script>
